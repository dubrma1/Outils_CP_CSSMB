<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Aide au Discernement Clinique & Éthique — PFAE & Pré-DEP | CSSMB</title>
  <meta name="description" content="Outil d'aide au discernement clinique et éthique pour comités de classement et directions du CSSMB (Art. 23.3, 1° du Régime pédagogique)." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
  <script>
    stlite.mount(
      {
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: "./app.py",
          },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
